name: Check companies

# Works out which hiring system (ATS) each company in the "Scout Companies" tab uses.
# New rows only, every Sunday night. Run by hand after adding companies to see them sooner.
on:
  schedule:
    - cron: "41 19 * * 0"
  workflow_dispatch:
    inputs:
      all:
        description: "Re-check every company, not only new rows"
        type: boolean
        default: false
      retry:
        description: "Also try again the companies that have no readable feed yet"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  detect:
    # Scheduled runs only start once the repository variable SCHEDULE_ON is set to true.
    if: github.event_name != 'schedule' || vars.SCHEDULE_ON == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m scout.detect ${{ inputs.all && '--all' || '' }} ${{ inputs.retry && '--retry' || '' }}
